<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Notícias</title>
    <link rel="stylesheet" href="./assets/css/login/estilo.css">
    <script src="./assets/js/login.js" type="module"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

    <body>
        <header>
            <div class="logo">A</div>
            <h1 class="titulo">Meu Site de Notícias</h1>
        </header>

        <div class="container">
            <h1>Login</h1>

            <form>
                <div class="input-grupo">
                    <i class="fas fa-envelope"></i>
                    <input id="email" type="email" placeholder="Informe seu e-mail" />
                </div>
                <div class="input-grupo">
                    <i class="fas fa-lock"></i>
                    <input id="senha" type="password" placeholder="Informe sua senha" />
                </div>
                <button><i class="fas fa-sign-in-alt"></i> Entrar</button>
            </form>
            <div class="links-auxiliares">
                <a href="#">Esqueceu a senha?</a>
                <span>-</span>
                <a href="#">Registre-se</a>
            </div>
        </div>
    </body>
